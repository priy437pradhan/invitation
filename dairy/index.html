<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #221F2E;
    --ink-soft: #3A3550;
    --paper: #F6EFE4;
    --paper-shadow: #E5DBC8;
    --teal: #4F7C82;
    --teal-deep: #37595E;
    --blush: #D9A5A0;
    --line: #D8CDB8;
    --text-dim: #6b6580;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #2c2740 0%, transparent 60%),
      linear-gradient(180deg, var(--ink) 0%, #262138 100%);
    font-family:'Inter', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:stretch;
    justify-content:center;
    padding: 32px 16px;
  }
  .book{
    width:100%;
    max-width: 980px;
    display:grid;
    grid-template-columns: 220px 1fr;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
    overflow:hidden;
    min-height: 640px;
    position:relative;
  }
  .book::before{
    content:"";
    position:absolute;
    left:220px;
    top:0; bottom:0;
    width:28px;
    margin-left:-14px;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.10) 45%, rgba(0,0,0,0.10) 55%, transparent);
    pointer-events:none;
    z-index:2;
  }
  .spine{
    background: linear-gradient(180deg, #2A2440, #221F2E);
    color: #E9E3F5;
    padding: 28px 18px;
    display:flex;
    flex-direction:column;
  }
  .spine h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  .addressee{
    font-family:'Newsreader', serif;
    font-style:italic;
    color: var(--blush);
    font-size: 0.92rem;
    margin: 0 0 22px;
    cursor:text;
    border-bottom: 1px dashed rgba(217,165,160,0.35);
    padding-bottom: 4px;
    background:transparent;
    border-top:none; border-left:none; border-right:none;
    outline:none;
    width:100%;
    font-weight:400;
  }
  .addressee::placeholder{ color: rgba(217,165,160,0.55); }

  .new-entry-btn{
    background: var(--teal);
    color:#fff;
    border:none;
    padding: 10px 14px;
    border-radius: 4px;
    font-family:'Inter';
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    margin-bottom: 20px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .new-entry-btn:hover{ background: var(--teal-deep); }
  .new-entry-btn:active{ transform: scale(0.98); }
  .new-entry-btn:focus-visible{ outline: 2px solid var(--blush); outline-offset:2px; }

  .entry-list{
    list-style:none;
    margin:0; padding:0;
    overflow-y:auto;
    flex:1;
  }
  .entry-list li{
    font-family:'Newsreader', serif;
    font-size: 0.88rem;
    color: #C9C2DD;
    padding: 9px 10px;
    border-radius: 4px;
    cursor:pointer;
    margin-bottom: 2px;
    display:flex;
    justify-content:space-between;
    gap:6px;
  }
  .entry-list li:hover{ background: rgba(255,255,255,0.06); }
  .entry-list li.active{ background: rgba(79,124,130,0.35); color:#fff; }
  .entry-list .dow{ color: #8A82A8; font-size:0.75rem; }

  .empty-list{
    font-family:'Newsreader', serif;
    font-style:italic;
    color:#8A82A8;
    font-size:0.85rem;
    padding: 8px 10px;
  }

  .page{
    padding: 36px 44px;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 33px, var(--paper-shadow) 34px);
    background-attachment: local;
  }
  .page-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .date-display{
    font-family:'Fraunces', serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--ink);
  }
  .on-this-day{
    font-family:'Inter';
    font-size: 0.78rem;
    color: var(--text-dim);
    max-width: 220px;
    text-align:right;
    line-height:1.4;
  }
  textarea{
    flex:1;
    min-height: 360px;
    resize: vertical;
    border:none;
    background:transparent;
    font-family:'Newsreader', serif;
    font-size: 1.08rem;
    line-height: 34px;
    color: var(--ink-soft);
    outline:none;
  }
  textarea::placeholder{ color: #A79FC0; font-style:italic; }

  .page-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top: 16px;
    padding-top:14px;
    border-top: 1px solid var(--line);
  }
  .status{
    font-size: 0.78rem;
    color: var(--text-dim);
    font-family:'Inter';
    min-height: 1em;
  }
  .footer-actions{ display:flex; gap:10px; }
  .save-btn{
    background: var(--ink);
    color: var(--paper);
    border:none;
    padding: 9px 20px;
    border-radius: 4px;
    font-family:'Inter';
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
  }
  .save-btn:hover{ background: var(--ink-soft); }
  .save-btn:focus-visible{ outline: 2px solid var(--teal); outline-offset:2px; }

  .grammar-btn{
    background: transparent;
    color: var(--teal-deep);
    border: 1px solid var(--teal);
    padding: 9px 16px;
    border-radius: 4px;
    font-family:'Inter';
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
  }
  .grammar-btn:hover{ background: rgba(79,124,130,0.1); }
  .grammar-btn:disabled{ opacity:0.5; cursor:default; }
  .grammar-btn:focus-visible{ outline: 2px solid var(--teal); outline-offset:2px; }

  .suggestions{
    margin-top: 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .suggestion-item{
    background: rgba(79,124,130,0.08);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    font-family:'Inter';
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .suggestion-item .msg{ margin-bottom: 6px; }
  .suggestion-item .bad{ font-family:'Newsreader', serif; font-style:italic; color:#8a3b3b; }
  .suggestion-item .fixes{ display:flex; flex-wrap:wrap; gap:6px; }
  .suggestion-item button{
    background: var(--teal);
    color:#fff;
    border:none;
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 0.78rem;
    cursor:pointer;
  }
  .suggestion-item button:hover{ background: var(--teal-deep); }
  .suggestion-empty{
    font-family:'Newsreader', serif;
    font-style:italic;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  .ribbon{
    position:absolute;
    top:0; right: 40px;
    width: 18px;
    height: 60px;
    background: var(--blush);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  }

  @media (max-width: 700px){
    .book{ grid-template-columns: 1fr; }
    .book::before{ display:none; }
    .spine{ flex-direction:column; max-height: 260px; }
    .entry-list{ display:flex; flex-wrap:wrap; gap:4px; overflow:visible; }
    .entry-list li{ flex: 0 0 auto; }
    .page{ padding: 26px 22px; }
    .page-header{ flex-direction:column; align-items:flex-start; gap:6px; }
    .on-this-day{ text-align:left; max-width:none; }
  }

  .cover{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(1200px 600px at 85% 110%, #34304a 0%, transparent 60%),
      linear-gradient(180deg, var(--ink) 0%, #262138 100%);
    z-index: 10;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  .cover.hidden{
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .cover-card{
    width: min(380px, 86vw);
    aspect-ratio: 3/4;
    background: linear-gradient(160deg, #2E2848, #221F2E);
    border-radius: 6px;
    box-shadow: 0 40px 90px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px 28px;
    text-align:center;
    position:relative;
  }
  .cover-card::before{
    content:"";
    position:absolute;
    inset: 14px;
    border: 1px solid rgba(233,227,245,0.18);
    border-radius: 3px;
    pointer-events:none;
  }
  .cover-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size: 2rem;
    color: #EFE9F8;
    margin: 0 0 10px;
  }
  .cover-sub{
    font-family:'Newsreader', serif;
    font-style:italic;
    color: var(--blush);
    font-size: 0.95rem;
    margin: 0 0 34px;
  }
  .open-btn{
    background: var(--teal);
    color: #fff;
    border:none;
    padding: 12px 28px;
    border-radius: 4px;
    font-family:'Inter';
    font-weight:600;
    font-size: 0.88rem;
    cursor:pointer;
    letter-spacing: 0.02em;
  }
  .open-btn:hover{ background: var(--teal-deep); }
  .open-btn:focus-visible{ outline: 2px solid var(--blush); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){
    .cover{ transition:none; }
  }
</style>
</head>
<body>
  <div class="cover" id="cover">
    <div class="cover-card">
      <div class="cover-title">Dear Journal</div>
      <div class="cover-sub">a page for every day</div>
      <button class="open-btn" id="openBtn">Open the diary</button>
    </div>
  </div>

  <div class="book">
    <nav class="spine">
      <h1>Dear Journal</h1>
      <input class="addressee" id="addressee" placeholder="Writing to... (optional)" />
      <button class="new-entry-btn" id="newEntryBtn">+ Today's page</button>
      <ul class="entry-list" id="entryList"></ul>
    </nav>

    <main class="page">
      <div class="ribbon"></div>
      <div class="page-header">
        <div class="date-display" id="dateDisplay">—</div>
        <div class="on-this-day" id="onThisDay"></div>
      </div>
      <textarea id="entryText" placeholder="Start writing..." spellcheck="true" lang="en"></textarea>
      <div class="page-footer">
        <div class="status" id="status"></div>
        <div class="footer-actions">
          <button class="grammar-btn" id="grammarBtn">Check grammar</button>
          <button class="save-btn" id="saveBtn">Save entry</button>
        </div>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </main>
  </div>

<script>
(function(){
  const DATA_KEY = 'diary-data';
  let data = { addressee: '', entries: {} }; // entries: { 'YYYY-MM-DD': text }
  let currentDate = todayKey();
  let saveTimer = null;

  const entryList = document.getElementById('entryList');
  const dateDisplay = document.getElementById('dateDisplay');
  const entryText = document.getElementById('entryText');
  const statusEl = document.getElementById('status');
  const addresseeInput = document.getElementById('addressee');
  const onThisDay = document.getElementById('onThisDay');

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function formatDate(key){
    const [y,m,d] = key.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }

  function shortDate(key){
    const [y,m,d] = key.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }

  function dow(key){
    const [y,m,d] = key.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'short' });
  }

  async function load(){
    try{
      const res = await window.storage.get(DATA_KEY, false);
      if(res && res.value){
        data = JSON.parse(res.value);
        if(!data.entries) data.entries = {};
      }
    }catch(e){
      // no existing data yet, start fresh
      data = { addressee:'', entries:{} };
    }
    addresseeInput.value = data.addressee || '';
    renderList();
    openEntry(currentDate);
  }

  async function persist(){
    try{
      await window.storage.set(DATA_KEY, JSON.stringify(data), false);
      return true;
    }catch(e){
      statusEl.textContent = 'Could not save just now — try again.';
      return false;
    }
  }

  function renderList(){
    const keys = Object.keys(data.entries).sort().reverse();
    entryList.innerHTML = '';
    if(keys.length === 0){
      const li = document.createElement('li');
      li.className = 'empty-list';
      li.textContent = 'No pages yet.';
      entryList.appendChild(li);
      return;
    }
    keys.forEach(k => {
      const li = document.createElement('li');
      li.className = k === currentDate ? 'active' : '';
      const label = document.createElement('span');
      label.textContent = shortDate(k);
      const d = document.createElement('span');
      d.className = 'dow';
      d.textContent = dow(k);
      li.appendChild(label);
      li.appendChild(d);
      li.addEventListener('click', () => openEntry(k));
      entryList.appendChild(li);
    });
  }

  function findOnThisDay(){
    const [, m, d] = currentDate.split('-');
    const matches = Object.keys(data.entries).filter(k => {
      const [, km, kd] = k.split('-');
      return km === m && kd === d && k !== currentDate;
    }).sort();
    if(matches.length === 0){ onThisDay.textContent = ''; return; }
    const years = matches.map(k => k.split('-')[0]);
    onThisDay.textContent = 'You also wrote on this day in ' + years.join(', ') + '.';
  }

  function openEntry(key){
    currentDate = key;
    dateDisplay.textContent = formatDate(key);
    entryText.value = data.entries[key] || '';
    statusEl.textContent = '';
    findOnThisDay();
    renderList();
    entryText.focus();
  }

  async function saveCurrent(showStatus){
    const text = entryText.value;
    if(text.trim() === ''){
      delete data.entries[currentDate];
    }else{
      data.entries[currentDate] = text;
    }
    const ok = await persist();
    if(ok && showStatus){
      statusEl.textContent = 'Saved just now.';
      setTimeout(() => { if(statusEl.textContent === 'Saved just now.') statusEl.textContent = ''; }, 2000);
    }
    renderList();
  }

  document.getElementById('saveBtn').addEventListener('click', () => saveCurrent(true));

  const grammarBtn = document.getElementById('grammarBtn');
  const suggestionsEl = document.getElementById('suggestions');

  async function checkGrammar(){
    const text = entryText.value;
    suggestionsEl.innerHTML = '';
    if(text.trim() === ''){
      suggestionsEl.innerHTML = '<div class="suggestion-empty">Nothing to check yet.</div>';
      return;
    }
    grammarBtn.disabled = true;
    grammarBtn.textContent = 'Checking...';
    try{
      const res = await fetch('https://api.languagetool.org/v2/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ text, language: 'en-US' })
      });
      if(!res.ok) throw new Error('bad response');
      const json = await res.json();
      renderSuggestions(json.matches || [], text);
    }catch(e){
      suggestionsEl.innerHTML = '<div class="suggestion-empty">Couldn\'t reach the grammar checker just now — your browser may be blocking the request, or you\'re offline. Your writing is safe either way.</div>';
    }finally{
      grammarBtn.disabled = false;
      grammarBtn.textContent = 'Check grammar';
    }
  }

  function renderSuggestions(matches, text){
    if(matches.length === 0){
      suggestionsEl.innerHTML = '<div class="suggestion-empty">No issues found — reads clean.</div>';
      return;
    }
    suggestionsEl.innerHTML = '';
    matches.slice(0, 20).forEach(m => {
      const bad = text.substring(m.offset, m.offset + m.length);
      const item = document.createElement('div');
      item.className = 'suggestion-item';

      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.innerHTML = m.message + ' — <span class="bad"></span>';
      msg.querySelector('.bad').textContent = '"' + bad + '"';
      item.appendChild(msg);

      const fixes = document.createElement('div');
      fixes.className = 'fixes';
      (m.replacements || []).slice(0, 4).forEach(r => {
        const btn = document.createElement('button');
        btn.textContent = 'Use "' + r.value + '"';
        btn.addEventListener('click', () => {
          const current = entryText.value;
          entryText.value = current.substring(0, m.offset) + r.value + current.substring(m.offset + m.length);
          suggestionsEl.innerHTML = '<div class="suggestion-empty">Applied. Re-check for anything else.</div>';
          saveCurrent(true);
        });
        fixes.appendChild(btn);
      });
      if((m.replacements || []).length === 0){
        const none = document.createElement('span');
        none.className = 'suggestion-empty';
        none.textContent = 'No direct fix suggested.';
        fixes.appendChild(none);
      }
      item.appendChild(fixes);
      suggestionsEl.appendChild(item);
    });
  }

  grammarBtn.addEventListener('click', checkGrammar);

  document.getElementById('newEntryBtn').addEventListener('click', () => {
    openEntry(todayKey());
  });

  entryText.addEventListener('input', () => {
    statusEl.textContent = 'Unsaved changes...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveCurrent(true), 1200);
  });

  addresseeInput.addEventListener('input', () => {
    data.addressee = addresseeInput.value;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => persist(), 800);
  });

  document.getElementById('openBtn').addEventListener('click', () => {
    document.getElementById('cover').classList.add('hidden');
    entryText.focus();
  });

  load();
})();
</script>
</body>
</html>
