
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited! 🩺✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #fce4ec, #e8f4f8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.15);
            padding: 25px;
            text-align: center;
            position: relative;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 13px;
            color: #777;
            margin-bottom: 15px;
        }
        .image-box {
            position: relative;
            height: 260px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #fff5f8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            animation: zoomIn 0.5s ease;
        }
        .image-box img.active {
            display: block;
        }
        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1, 1); opacity: 1; }
        }
        .dialogue-box {
            background: #fff0f5;
            border-left: 4px solid #d63384;
            padding: 12px 15px;
            border-radius: 0 12px 12px 0;
            font-size: 14px;
            color: #444;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(135deg, #d63384, #ff6b8b);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(214, 51, 132, 0.3);
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(214, 51, 132, 0.4);
        }
        /* Scratch Card Section */
        .scratch-container {
            position: relative;
            width: 100%;
            height: 110px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .scratch-reveal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 2px dashed #d63384;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: #333;
        }
        .scratch-reveal h3 {
            color: #d63384;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .scratch-reveal p {
            font-size: 12px;
            color: #555;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            touch-action: none;
            border-radius: 12px;
        }
        /* Countdown styles */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
            display: none;
        }
        .time-box {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .time-box span {
            display: block;
            font-weight: bold;
            color: #d63384;
            font-size: 16px;
        }
        .time-box small {
            font-size: 10px;
            color: #777;
        }
        .step-indicator {
            font-size: 11px;
            color: #aaa;
            margin-top: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>You're Invited! 🩺💌</h1>
        <div class="subtitle">Dr. Vikrant is inviting you</div>

        <div class="image-box">
            <img id="slideImg1" src="images/couple-whisper.png" alt="Whispering Doctors" class="active">
            <img id="slideImg2" src="images/couple-walk.png" alt="Walking Doctors">
        </div>

        <div class="dialogue-box" id="dialogueText">
            "You are invited! Dr. Vikrant wants you there, but let's keep it between us—something special is brewing..."
        </div>

        <button class="btn" id="actionBtn" onclick="handleNextStep()">Tap to Uncover the Plan 🕵️‍♂️</button>

        <div class="scratch-container" id="scratchContainer">
            <div class="scratch-reveal">
                <h3>✨ SECRET DETAILS ✨</h3>
                <p>📍 <strong>Venue:</strong> Starlight Grand Ballroom<br>
                ⏰ <strong>Time:</strong> Saturday @ 7:30 PM<br>
                <em>See you there! 🥂</em></p>
            </div>
            <canvas id="scratchCanvas" width="400" height="110"></canvas>
        </div>

        <div class="countdown-grid" id="countdownGrid">
            <div class="time-box"><span id="days">00</span><small>Days</small></div>
            <div class="time-box"><span id="hours">00</span><small>Hours</small></div>
            <div class="time-box"><span id="mins">00</span><small>Mins</small></div>
            <div class="time-box"><span id="secs">00</span><small>Secs</small></div>
        </div>

        <div class="step-indicator" id="stepIndicator">STEP 1 OF 3</div>
    </div>

    <script>
        let currentStep = 1;
        const dialogueText = document.getElementById("dialogueText");
        const actionBtn = document.getElementById("actionBtn");
        const slideImg1 = document.getElementById("slideImg1");
        const slideImg2 = document.getElementById("slideImg2");
        const scratchContainer = document.getElementById("scratchContainer");
        const countdownGrid = document.getElementById("countdownGrid");
        const stepIndicator = document.getElementById("stepIndicator");

        function handleNextStep() {
            if (currentStep === 1) {
                // Move to Step 2
                dialogueText.innerHTML = "You are officially invited by Dr. Vikrant! He has a special plan in store for everyone that day... 🤫";
                slideImg1.classList.remove("active");
                slideImg2.classList.add("active");
                actionBtn.innerText = "Scratch to Reveal Venue 🎫";
                stepIndicator.innerText = "STEP 2 OF 3";
                currentStep = 2;
            } else if (currentStep === 2) {
                // Show Scratch Card & Countdown
                dialogueText.innerHTML = "You are invited! Scratch the card below to reveal the secret venue & time. Don't spoil the surprise! ✨";
                actionBtn.style.display = "none";
                scratchContainer.style.display = "block";
                countdownGrid.style.display = "grid";
                stepIndicator.innerText = "STEP 3 OF 3 - CONFIDENTIAL";
                initScratchCard();
            }
        }

        // Countdown Timer Logic (Target: 7 days from now)
        const targetDate = new Date().getTime() + (7 * 24 * 60 * 60 * 1000);
        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            document.getElementById("days").innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById("hours").innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById("mins").innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById("secs").innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
        }, 1000);

        // Scratch Card Canvas Implementation
        function initScratchCard() {
            const canvas = document.getElementById("scratchCanvas");
            const ctx = canvas.getContext("2d");
            
            // Fill scratch cover layer
            ctx.fillStyle = "#c0c0c0";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#555";
            ctx.font = "bold 14px Poppins, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("✨ SCRATCH HERE TO REVEAL VENUE ✨", canvas.width / 2, canvas.height / 2 + 5);

            let isDrawing = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function scratch(e) {
                if (!isDrawing) return;
                const pos = getPos(e);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 20, 0, Math.PI * 2, false);
                ctx.fill();
            }

            canvas.addEventListener("mousedown", (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener("mousemove", scratch);
            window.addEventListener("mouseup", () => { isDrawing = false; });

            canvas.addEventListener("touchstart", (e) => { isDrawing = true; scratch(e); e.preventDefault(); });
            canvas.addEventListener("touchmove", (e) => { scratch(e); e.preventDefault(); });
            window.addEventListener("touchend", () => { isDrawing = false; });
        }
    </script>
</body>
</html>
